name: Notion 동기화 + 정적 사이트 빌드

on:
  schedule:
    # 21:00 UTC = 06:00 KST (매일)
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 두 실행이 겹치면(예: 스케줄 실행 중 수동으로 또 실행) 같은 브랜치에 동시에
# 커밋·푸시를 시도해 "fetch first" 충돌이 난다. 동시 실행을 막고, 겹치면
# 취소하지 않고 순서대로 대기시킨다.
concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Notion 동기화 (증분)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID_YOUTUBE: ${{ secrets.NOTION_DB_ID_YOUTUBE }}
          NOTION_DB_ID_BOOK: ${{ secrets.NOTION_DB_ID_BOOK }}
        run: python sync_notion.py all

      - name: 정적 사이트 데이터 빌드
        run: python build_static.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: daily Notion sync ($(date -u +%Y-%m-%d))"

          # concurrency로 동시 실행은 막았지만, 그 사이 다른 경로(예: 로컬에서
          # 직접 push)로 main이 앞서갔을 가능성에 대비해 재시도한다.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "푸시 실패 (시도 $attempt/3), origin/main을 반영해 재시도합니다..."
            git pull --rebase origin main
          done
          echo "3회 재시도 후에도 푸시 실패"
          exit 1
