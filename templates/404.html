{% extends "base.html" %}
{#
  404.html - 페이지를 찾을 수 없을 때 표시되는 에러 화면
#}

{% block title %}페이지 없음 - 빨모쌤 영어공부{% endblock %}
{% block header_title %}오류 발생{% endblock %}

{% block content %}
  <div class="empty-state" style="padding-top:80px;">
    <span class="empty-icon">🔍</span>
    <h2 style="font-size:1.2rem; margin-bottom:12px;">페이지를 찾을 수 없습니다</h2>
    <p>요청하신 학습 데이터가 없거나<br>잘못된 주소입니다.</p>
    <a href="/"
       style="display:inline-block; margin-top:24px; padding:12px 28px;
              background:linear-gradient(135deg,#6366f1,#8b5cf6);
              color:white; border-radius:99px; text-decoration:none;
              font-weight:600; font-size:0.9rem;">
      🏠 홈으로 돌아가기
    </a>
  </div>
{% endblock %}
