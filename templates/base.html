<!DOCTYPE html>
<!--
  base.html - 공통 레이아웃 템플릿 (Jinja2)
  모든 페이지가 이 템플릿을 상속(extends)하여 사용한다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 뷰포트 최적화 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- SEO 메타 태그 -->
  <meta name="description" content="빨모쌤과 함께하는 개인 영어 학습 웹앱. Notion 연동 영어 표현 반복 학습.">
  <meta name="theme-color" content="#0a0e1a">

  <!-- iOS 홈화면 추가 지원 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="빨모쌤 영어">

  <title>{% block title %}빨모쌤과 함께하는 영어공부{% endblock %}</title>

  <!-- 스타일시트 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- 추가 스타일 (각 페이지에서 오버라이드 가능) -->
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- 앱 전체 컨테이너 (모바일 최대 너비 제한) -->
  <div class="app-container">

    <!-- ── 앱 헤더 ── -->
    <header class="app-header">
      <!-- 뒤로가기 버튼 (홈 화면에서는 숨김) -->
      {% if show_back %}
        <button class="header-back-btn" aria-label="뒤로가기" title="뒤로가기">←</button>
      {% endif %}

      <!-- 페이지 제목 -->
      <h2 class="header-title">{% block header_title %}빨모쌤 영어공부{% endblock %}</h2>

      <!-- 날짜 뱃지 (날짜 관련 페이지에서만 표시) -->
      {% block header_badge %}{% endblock %}
    </header>

    <!-- ── 페이지 콘텐츠 (각 페이지에서 채움) ── -->
    <main class="page-content">
      {% block content %}{% endblock %}
    </main>

    <!-- ── 하단 네비게이션 바 ── -->
    <nav class="bottom-nav" aria-label="메인 메뉴">
      <a href="/"       class="nav-item" id="nav-home">
        <span class="nav-icon">📅</span>
        <span>날짜선택</span>
      </a>
      <a href="/book"   class="nav-item" id="nav-book">
        <span class="nav-icon">📚</span>
        <span>책공부</span>
      </a>
    </nav>

  </div><!-- /.app-container -->

  <!-- ── 토스트 알림 영역 (JS로 동적 생성) ── -->

  <!-- ── 공통 JS 파일 로드 ── -->
  <script src="{{ url_for('static', filename='js/tts-control.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ko-en-toggle.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sentence-player.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <!-- 각 페이지별 추가 JS -->
  {% block extra_js %}{% endblock %}
</body>
</html>
