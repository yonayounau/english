<!DOCTYPE html>
<!--
  practice.html - 연습하기 화면 (정적 사이트 버전)
  ?date=YYYY-MM-DD 로 지정된 날짜의 키워드 + 나만의 문장을 스크롤 목록으로 표시.
  자동재생: 영어 있으면 TTS + 4초 대기, 한글만 있으면 2초 대기 후 다음.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="빨모쌤 영어">

  <title>연습하기 - 빨모쌤 영어공부</title>

  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <button class="header-back-btn" aria-label="뒤로가기" title="뒤로가기">←</button>
      <h2 class="header-title">🗣️ 연습하기</h2>
      <span class="header-date-badge" id="header-date-badge"></span>
    </header>

    <main class="page-content">

      <div class="practice-header">
        <h1 class="practice-title">오늘의 연습 문장</h1>
        <p class="practice-sub">문장을 탭하면 영어로 읽어드립니다 🔊</p>
      </div>

      <div class="auto-play-fab-wrap">
        <button class="auto-play-btn" id="auto-play-btn" title="자동 재생">
          <span class="auto-play-icon">▶</span>
          <span class="auto-play-text">자동재생</span>
        </button>
      </div>

      <div id="practice-content"></div>

      <div class="empty-state" id="empty-state" style="display:none;">
        <span class="empty-icon">📭</span>
        <p>연습할 문장이 없습니다.</p>
      </div>

    </main>

    <nav class="bottom-nav" aria-label="메인 메뉴">
      <a href="index.html" class="nav-item" id="nav-home">
        <span class="nav-icon">📅</span>
        <span>날짜선택</span>
      </a>
      <a href="book.html" class="nav-item" id="nav-book">
        <span class="nav-icon">📚</span>
        <span>책공부</span>
      </a>
    </nav>

  </div>

  <script src="static/js/tts-control.js"></script>
  <script src="static/js/ko-en-toggle.js"></script>
  <script src="static/js/sentence-player.js"></script>
  <script src="static/js/main.js"></script>
  <script src="static/js/static-helpers.js"></script>

  <script>
    // ============================================================
    // 연습하기 화면 - 문장 탭 TTS 재생 + 자동재생
    // ============================================================

    let currentPlayingItem = null;

    function renderPracticeList(title, sentences) {
      const items = sentences.map((s, idx) => `
        <div class="practice-item"
             data-en="${escapeAttr(s.en)}"
             data-idx="${idx}"
             onclick="playPractice(this)"
             role="button"
             tabindex="0"
             aria-label="${escapeAttr(s.en)}">
          <div class="practice-item-num">${idx + 1}번</div>
          <div class="practice-item-en">${s.en}</div>
          <div class="practice-item-ko">${escapeAttr(s.ko)}</div>
        </div>
      `).join('');

      return `
        <p class="section-label">${title}</p>
        <div class="practice-list">${items}</div>
      `;
    }

    function playPractice(item) {
      if (autoPlaying) stopAutoPlay();

      if (currentPlayingItem && currentPlayingItem !== item) {
        currentPlayingItem.classList.remove('playing');
      }

      if (currentPlayingItem === item && ttsControl.playing) {
        ttsControl.stop();
        item.classList.remove('playing');
        currentPlayingItem = null;
        return;
      }

      const enText = item.dataset.en;
      if (!enText) return;

      currentPlayingItem = item;
      item.classList.add('playing');

      ttsControl.onEnd = () => {
        item.classList.remove('playing');
        if (currentPlayingItem === item) currentPlayingItem = null;
      };

      ttsControl.speak(enText);
    }

    // ============================================================
    // 자동재생
    // ============================================================
    let autoPlaying   = false;
    let autoPlayTimer = null;
    let autoPlayIdx   = -1;
    let autoPlayItems = [];

    const AUTO_PLAY_EN_DELAY_MS = 4000;
    const AUTO_PLAY_KO_DELAY_MS = 2000;

    function updateAutoPlayBtn(playing) {
      const btn = document.getElementById('auto-play-btn');
      if (!btn) return;
      btn.classList.toggle('playing', playing);
      btn.querySelector('.auto-play-icon').textContent = playing ? '⏸' : '▶';
      btn.querySelector('.auto-play-text').textContent = playing ? '정지' : '자동재생';
    }

    function stopAutoPlay() {
      autoPlaying = false;
      if (autoPlayTimer) {
        clearTimeout(autoPlayTimer);
        autoPlayTimer = null;
      }
      ttsControl.stop();
      if (currentPlayingItem) {
        currentPlayingItem.classList.remove('playing');
        currentPlayingItem = null;
      }
      updateAutoPlayBtn(false);
    }

    function playAutoStep() {
      if (!autoPlaying) return;

      if (currentPlayingItem) currentPlayingItem.classList.remove('playing');

      if (autoPlayIdx >= autoPlayItems.length) {
        stopAutoPlay();
        return;
      }

      const item = autoPlayItems[autoPlayIdx];
      currentPlayingItem = item;
      item.classList.add('playing');
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });

      const enText = item.dataset.en || '';
      const hasEn  = enText.replace(/<[^>]+>/g, '').trim().length > 0;

      if (hasEn) {
        ttsControl.speak(enText);
        autoPlayTimer = setTimeout(() => { autoPlayIdx++; playAutoStep(); }, AUTO_PLAY_EN_DELAY_MS);
      } else {
        autoPlayTimer = setTimeout(() => { autoPlayIdx++; playAutoStep(); }, AUTO_PLAY_KO_DELAY_MS);
      }
    }

    function startAutoPlay() {
      autoPlayItems = Array.from(document.querySelectorAll('.practice-item'));
      if (autoPlayItems.length === 0) return;
      autoPlaying  = true;
      autoPlayIdx  = 0;
      updateAutoPlayBtn(true);
      playAutoStep();
    }

    // ============================================================
    // 초기화
    // ============================================================
    async function init() {
      const date = getQueryParam('date');
      const content = document.getElementById('practice-content');
      if (!date) {
        content.innerHTML = '<p style="color:#94a3b8;">날짜가 지정되지 않았습니다.</p>';
        return;
      }
      document.getElementById('header-date-badge').textContent = formatDateDisplay(date);

      const lesson = await fetchJsonSafe(`data/youtube/${date}.json`);
      if (!lesson) {
        document.getElementById('empty-state').style.display = '';
        return;
      }

      const keywords    = lesson.keywords || [];
      const mySentences = lesson.my_sentences || [];

      if (keywords.length === 0 && mySentences.length === 0) {
        document.getElementById('empty-state').style.display = '';
        return;
      }

      let html = '';
      if (keywords.length > 0)    html += renderPracticeList('📖 학습 키워드', keywords);
      if (mySentences.length > 0) html += renderPracticeList('✍️ 나만의 문장', mySentences);
      content.innerHTML = html;

      document.querySelectorAll('.practice-item').forEach(item => {
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            playPractice(item);
          }
        });
      });

      const autoPlayBtn = document.getElementById('auto-play-btn');
      autoPlayBtn.addEventListener('click', () => {
        if (autoPlaying) stopAutoPlay(); else startAutoPlay();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initBackButton();
      updateNavActive();
      document.documentElement.style.scrollBehavior = 'smooth';
      init();
    });
  </script>
</body>
</html>
